name: Test Summary
on: workflow_dispatch
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse tests.xml to job summary
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET, os

          tree = ET.parse("tests.xml")
          ts = tree.getroot().find("testsuite")

          total = int(ts.get("tests", 0))
          fail  = int(ts.get("failures", 0))
          err   = int(ts.get("errors", 0))
          skip  = int(ts.get("skipped", 0))
          pass_ = total - fail - err - skip
          dur   = float(ts.get("time", 0))

          rows = []
          for tc in ts.findall("testcase"):
              name = tc.get("name")
              stat = "❌" if tc.find("failure") is not None else "⚠️" if tc.find("error") is not None else "➖" if tc.get("skipped") else "✅"
              rows.append(f"| {stat} | `{name}` | {tc.get('time', '')}s |")

          summary = f"""## Test Results

| | Total | Passed | Failed | Errors | Skipped |
|---:|:---:|:---:|:---:|:---:|:---:|
| **Count** | {total} | {pass_} | {fail} | {err} | {skip} |

**Duration:** {dur:.2f}s

### Individual Results

| Status | Test | Time |
|:---:|:---|---:|
{chr(10).join(rows)}
"""
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path, "w") as f:
                  f.write(summary)
              print("Summary written")
          else:
              print(summary)
          EOF
