name: Update README Test Summary

# Triggers the workflow on pushes to the main branch
on:
  push:
    branches: [ main, master ]
  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update_readme:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Fetching full history is essential for the git-auto-commit-action
        fetch-depth: 0 
        
    # --- 1. Read the Committed Log File and Format Content ---
    - name: Format Test Log Content for Markdown
      id: generate_content
      run: |
        # Check if the test log file exists
        if [ ! -f "test-log.txt" ]; then
          echo "Test log file (test-log.txt) not found. Skipping README update."
          # Set output to skip update if file is missing
          echo "content=Test log (test-log.txt) not found. Please ensure tests are run and the file is committed." >> $GITHUB_OUTPUT
          
        else
          # Read the content of the committed log file
          LOG_CONTENT=$(cat test-log.txt)
          
          # Format it nicely for Markdown, ensuring multi-line content works
          # We use a code block for clean display of the summary text.
          FORMATTED_CONTENT="## Last Local Test Summary\n\n\`\`\`text\n${LOG_CONTENT}\n\`\`\`"
          
          # Set the formatted string as a multi-line step output
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo -e "${FORMATTED_CONTENT}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi
      shell: bash
      
    # --- 2. Inject Content into README using the Corrected Action ---
    - name: Inject content into README section
      # CORRECTED ACTION REFERENCE: owner/repository@version
      uses: open-turo/action-renovate@v1 
      with:
        SECTION_NAME: test_summary
        CONTENT: ${{ steps.generate_content.outputs.content }}
        
    # --- 3. Commit the Changes Back to the Repository ---
    - name: Commit updated README
      # Uses the output from the injection step to see if any changes were made
      if: success() && steps.inject_content.outputs.file_changed == 'true'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore(readme): Auto-update test summary"
        # Uses the GitHub Actions bot for the commit
        commit_user_name: 'github-actions[bot]'
        commit_user_email: 'github-actions[bot]@users.noreply.github.com'
