[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hbcd-genomic-release"
version = "0.1.0"
description = "HBCD Genomics Release Pipeline: De-identification, filtering, and validation of genomic data for HBCD data releases"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "HBCD Genomics Team", email = "hbcd-genomics@umn.edu"},
]
maintainers = [
    {name = "HBCD Genomics Team", email = "hbcd-genomics@umn.edu"},
]
keywords = [
    "genomics",
    "hbcd",
    "de-identification",
    "plink",
    "vcf",
    "cnv",
    "imputation",
    "topmed",
    "data-release",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]
optional-dependencies = {
    "dev": [
        "pytest-cov>=4.0.0",
        "ruff>=0.1.0",
        "black>=23.0.0",
        "mypy>=1.0.0",
    ],
    "docs": [
        "sphinx>=7.0.0",
        "sphinx-rtd-theme>=1.3.0",
        "myst-parser>=2.0.0",
    ],
    "r": [
        "rpy2>=3.5.0",
    ],
}

[project.urls]
Homepage = "https://github.com/hbcd-genomics/hbcd-genomic-release"
Repository = "https://github.com/hbcd-genomics/hbcd-genomic-release"
Issues = "https://github.com/hbcd-genomics/hbcd-genomic-release/issues"
Documentation = "https://hbcd-genomic-release.readthedocs.io/"
Changelog = "https://github.com/hbcd-genomics/hbcd-genomic-release/blob/main/CHANGELOG.md"

[project.scripts]
hbcd-genomic-release = "run_release_pipeline:main"
filter-genotype = "25-filterGenotypeFiles:main"
filter-vcf = "27-filter_imputed_vcf:main"
filter-cnv = "28-cnv-deid:main"
filter-derivatives = "29-filter_release_outputs:main"
validate-exclusions = "30-validateExclusions:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "requires_bcftools: marks tests requiring bcftools",
    "requires_plink2: marks tests requiring plink2",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default arguments
]
per-file-ignores = {
    "tests/*": ["S101", "S106"],  # allow assert and hardcoded passwords in tests
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "futureScripts/*",
    "setup/*",
    "__pycache__/*",
    "*.pyc",
]

[tool.coverage.report]
exclude-lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.sphinx]
source-dir = "docs/source"
build-dir = "docs/build"

[tool.setuptools.package-data]
"*" = ["*.tsv", "*.csv", "*.txt", "*.md", "*.qmd", "*.SLURM", "*.sh", "*.R", "*.py"]