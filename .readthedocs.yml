# ReadTheDocs Configuration for HBCD Genomic Release Pipeline
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  # System dependencies for documentation building
  apt_packages:
    - plink2
    - bcftools
    - tabix
    - bgzip

# Python environment setup
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

# Documentation build
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

# Optional: Build PDF/epub
formats:
  - pdf
  - epub

# Version management
versions:
  # Only build docs for tagged releases and main branch
  - main
  - latest
  - stable

# Notifications (optional)
# notifications:
#   webhooks:
#     - url: https://your-webhook-url
#       events:
#         - build.passed
#         - build.failed

# Conditional builds (skip forks, PRs from forks)
# Only build on the main repository
# exclude_branches:
#   - "^feature/"
#   - "^fix/"